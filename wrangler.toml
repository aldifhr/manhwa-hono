#:schema node_modules/wrangler/config-schema.json
name = "manhwa-hono"
main = "src/index.ts"
compatibility_date = "2026-10-01"
compatibility_flags = ["nodejs_compat"]

# The cron tick. 5 minutes matches the Python backend's cadence, which was
# chosen so a chapter is announced within one source's publish-to-scrape lag.
# Each tick runs the fetch pass then the dispatch pass.
[triggers]
crons = ["*/5 * * * *"]

# D1 — the SQLite database.
#
# Create it once, then paste the id below:
#   npx wrangler d1 create manhwa
#   npx wrangler d1 execute manhwa --remote --file=./schema.sql
#
# The id is NOT a secret (it is useless without account access), so it belongs
# in this file. Everything that IS a secret goes in `wrangler secret put`.
[[d1_databases]]
binding = "DB"
database_name = "manhwa"
database_id = "8cb0ae09-8e34-4f9f-908f-de6e99771e64"

[vars]
ENVIRONMENT = "production"
SCRAPE_FRESH_WINDOW_HOURS = "24"
# Comma-separated, matching the Python DISABLED_SOURCES.
DISABLED_SOURCES = ""

# Voratoon egress proxy. api.voratoon.com is blocked at Cloudflare's edge for
# the VPS's IP, so voratoon is unreachable directly from a self-hosted runner.
# This Worker-to-Worker hop runs on Cloudflare's own network and reaches it.
# Leave empty to call the API directly (works when deployed off-VPS).
VORATOON_PROXY_URL = "https://voratoon-proxy.monsterdrop7.workers.dev"

# ── SECRETS — never put these in [vars] ──────────────────────────────────────
# This file is committed to a public repo. A value written here is public.
# Set them with:
#
#   npx wrangler secret put DISCORD_WEBHOOK_URL
#   npx wrangler secret put ADMIN_REPORT_WEBHOOK_URL
#   npx wrangler secret put MONITOR_AUTH_TOKEN
#
# or, for a git-connected build, in the dashboard under
# Settings → Variables and Secrets → add as "Secret".
#
#   DISCORD_WEBHOOK_URL       chapter feed — where notifications land
#   ADMIN_REPORT_WEBHOOK_URL  alerts only; keep it a DIFFERENT channel so a
#                             pipeline error never lands in the reader feed
#   MONITOR_AUTH_TOKEN        bearer for the mutating API routes
#
# For LOCAL development use `.dev.vars` (gitignored), which overrides [vars]
# without ever touching this file. See `.dev.vars.example`.

[observability]
enabled = true

[observability.logs]
invocation_logs = true
